[project]
name = "blego-bt-server"
version = "0.1.0"
description = "Bluetooth server managing LEGO Powerd Up hubs"
authors = [
    { name = "Petr Jindra", email = "el.mordo@gmail.com" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bleak>=1.0.0,<2.0"
]

[project.urls]
repository = "https://github.com/elmordo/blego"
homepage = "https://github.com/elmordo/blego"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
